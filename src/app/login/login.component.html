<main>
  <section class="section section-shaped section-lg">
    <div class="shape shape-style-1 bg-gradient-default">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="container pt-lg-md">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card bg-secondary shadow border-0">
            <div class="card-header bg-white pb-4">
              <div class="text-muted text-center mb-3">
                <small>Authenticate with ApplicazioniuWebCloud</small>
              </div>
              <p class="text-center text-sm mb-0">Your session token never leaves the browser.</p>
            </div>
            <div class="card-body px-lg-5 py-lg-5">
              <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="on" novalidate>
                <div class="form-group mb-3" [ngClass]="{'focused':loginForm.controls.email.touched}">
                  <div class="input-group input-group-alternative">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="ni ni-email-83"></i></span>
                    </div>
                    <input class="form-control" placeholder="Email" type="email" formControlName="email">
                  </div>
                  <small class="text-danger" *ngIf="loginForm.controls.email.invalid && loginForm.controls.email.touched">
                    Please provide a valid email address.
                  </small>
                </div>
                <div class="form-group" [ngClass]="{'focused':loginForm.controls.password.touched}">
                  <div class="input-group input-group-alternative">
                    <div class="input-group-prepend">
                      <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
                    </div>
                    <input class="form-control" placeholder="Password" type="password" formControlName="password">
                  </div>
                  <small class="text-danger" *ngIf="loginForm.controls.password.invalid && loginForm.controls.password.touched">
                    Password must be at least 8 characters.
                  </small>
                </div>
                <div class="custom-control custom-control-alternative custom-checkbox">
                  <input class="custom-control-input" id="customCheckLogin" type="checkbox" formControlName="remember">
                  <label class="custom-control-label" for="customCheckLogin">
                    <span>Remember me on this device</span>
                  </label>
                </div>
                <div class="mt-3" *ngIf="errorMessage">
                  <div class="alert alert-warning" role="alert">{{ errorMessage }}</div>
                </div>
                <div class="text-center">
                  <button type="submit" class="btn btn-primary my-4" [disabled]="isSubmitting">
                    {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
                  </button>
                </div>
              </form>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-6">
              <a routerLink="/landing" class="text-light">
                <small>Security practices</small>
              </a>
            </div>
            <div class="col-6 text-right">
              <a routerLink="/register" class="text-light">
                <small>Create new account</small>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
